<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#180c14" />
    <meta name="description" content="مساحة رومانسية دافئة للتواصل مع ليان عبر تيليجرام." />
    <title>مساحة ليان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="glow glow-one" aria-hidden="true"></div>
    <div class="glow glow-two" aria-hidden="true"></div>

    <div class="petals" aria-hidden="true">
      <span style="--x:8%;--d:0s;--s:.8"></span>
      <span style="--x:18%;--d:-7s;--s:1.1"></span>
      <span style="--x:35%;--d:-12s;--s:.65"></span>
      <span style="--x:51%;--d:-3s;--s:.9"></span>
      <span style="--x:69%;--d:-14s;--s:1.2"></span>
      <span style="--x:81%;--d:-8s;--s:.75"></span>
      <span style="--x:93%;--d:-17s;--s:1"></span>
    </div>

    <header class="topbar">
      <a class="brand" href="#home" aria-label="العودة إلى البداية">
        <span class="brand-mark">ل</span>
        <span>مساحة ليان</span>
      </a>
      <span class="status"><i></i> هنا تبدأ الحكاية</span>
    </header>

    <main id="home">
      <section class="hero">
        <div class="eyebrow"><span>✦</span> رسالة صغيرة من القلب <span>✦</span></div>

        <div class="ornament" aria-hidden="true">
          <span></span><b>♡</b><span></span>
        </div>

        <h1>بعضُ اللقاءات<br /><em>تشبهُ الأمنيات</em></h1>

        <p class="intro">
          وبين زحام الأيام، تبقى هناك روحٌ واحدة<br class="desktop-break" />
          تجعل للكلمات معنى… وللوقتِ دفئاً مختلفاً.
        </p>

        <a class="telegram-button" href="https://web.telegram.org/k/#@Layann_19" target="_blank" rel="noopener noreferrer" aria-label="تواصل مع ليان عبر تيليجرام">
          <span class="button-shine"></span>
          <span class="telegram-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img"><path d="M21.8 3.1 18.5 20c-.25 1.2-.9 1.5-1.83.93l-5.05-3.72-2.44 2.35c-.27.27-.5.5-1.02.5l.36-5.14 9.36-8.46c.41-.36-.09-.57-.63-.21L5.68 13.53.7 11.97c-1.08-.34-1.1-1.08.23-1.6L20.4 2.86c.9-.33 1.69.22 1.4 1.24Z"/></svg>
          </span>
          <span class="button-copy">
            <strong>تحدث معي على تيليجرام</strong>
            <small>@Layann_19</small>
          </span>
          <span class="arrow" aria-hidden="true">←</span>
        </a>

        <p class="whisper">ربما تكون رسالة واحدة… بداية لشيءٍ جميل.</p>

        <div class="signature" aria-label="ليان">
          <span>ليان</span>
          <svg viewBox="0 0 165 24" aria-hidden="true"><path d="M3 15c29-8 60-9 93-4 24 4 39 1 55-8-18 13-43 17-73 13-25-4-48-2-68 5"/></svg>
        </div>
      </section>
    </main>

    <footer>
      <span>صُنعت بمشاعر دافئة</span>
      <span class="footer-heart">♥</span>
      <span>للحظات التي تستحق</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
